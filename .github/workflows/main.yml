          // 9. Realtime Chat Screen
          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun ChatScreen(navController: NavController, contactName: String) {
              val context = LocalContext.current
              var messageText by remember { mutableStateOf("") }
              val messages = remember {
                  mutableStateListOf(
                      ChatMessage("1", "provider", "Bonjour ! J'ai bien reçu votre demande de soins."),
                      ChatMessage("2", "client", "Bonjour, parfait. Êtes-vous équipé de tout le matériel nécessaire ?"),
                      ChatMessage("3", "provider", "Oui absolument, je serai chez vous à 14:00 précises.")
                  )
              }

              Scaffold(
                  topBar = {
                      TopAppBar(
                          title = { Text(contactName, fontWeight = FontWeight.Bold) },
                          navigationIcon = {
                              IconButton(onClick = { navController.popBackStack() }) {
                                  Icon(Icons.Default.ArrowBack, contentDescription = "Back")
                              }
                          },
                          actions = {
                              IconButton(onClick = {
                                  val callIntent = Intent(Intent.ACTION_DIAL, Uri.parse("tel:0550123456"))
                                  context.startActivity(callIntent)
                              }) {
                                  Icon(Icons.Default.Call, contentDescription = "Appeler", tint = AlgerianGreenPrimary)
                              }
                          }
                      )
                  }
              ) { padding ->
                  Column(
                      modifier = Modifier
                          .fillMaxSize()
                          .padding(padding)
                          .padding(12.dp)
                  ) {
                      LazyColumn(modifier = Modifier.weight(1f)) {
                          items(messages) { msg ->
                              val isMe = msg.senderId == "client"
                              Box(modifier = Modifier.fillMaxWidth(), contentAlignment = if (isMe) Alignment.CenterEnd else Alignment.CenterStart) {
                                  Card(
                                      colors = CardDefaults.cardColors(containerColor = if (isMe) AlgerianGreenPrimary else Color(0xFFE2E8F0)),
                                      shape = RoundedCornerShape(14.dp),
                                      modifier = Modifier.padding(vertical = 4.dp)
                                  ) {
                                      Text(msg.text, modifier = Modifier.padding(10.dp), color = if (isMe) Color.White else Color(0xFF0F172A))
                                  }
                              }
                          }
                      }
                      Row(verticalAlignment = Alignment.CenterVertically) {
                          OutlinedTextField(
                              value = messageText,
                              onValueChange = { messageText = it },
                              modifier = Modifier.weight(1f),
                              shape = RoundedCornerShape(24.dp),
                              placeholder = { Text("Écrivez un message...") }
                          )
                          Spacer(modifier = Modifier.width(8.dp))
                          IconButton(onClick = {
                              if (messageText.isNotBlank()) {
                                  messages.add(ChatMessage(System.currentTimeMillis().toString(), "client", messageText))
                                  messageText = ""
                              }
                          }) {
                              Icon(Icons.Default.Send, contentDescription = "Send", tint = AlgerianGreenPrimary)
                          }
                      }
                  }
              }
          }

