              <string name="btn_register">إنشاء حساب جديد</string>
              <string name="btn_google">المتابعة عبر Google</string>
              <string name="role_client">زبون (طالب خدمة)</string>
              <string name="role_provider">مقدم خدمة (حرفي/مهني)</string>
              <string name="what_need">ما هي الخدمة التي تحتاجها؟</string>
