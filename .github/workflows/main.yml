                  ServiceCategory("4", "Femme de ménage", "عاملة منزلية", "https://images.unsplash.com/photo-1581578731548-c64695cc6952?w=600&auto=format&fit=crop&q=80"),
                  ServiceCategory("5", "Jardinier", "بستاني", "https://images.unsplash.com/photo-1558904541-efa8c4a08931?w=600&auto=format&fit=crop&q=80"),
                  ServiceCategory("6", "Plombier", "سباك", "https://images.unsplash.com/photo-1607472586893-edb57bdc0e39?w=600&auto=format&fit=crop&q=80"),
                  ServiceCategory("7", "Électricien", "كهربائي", "https://images.unsplash.com/photo-1621905251189-08b45d6a269e?w=600&auto=format&fit=crop&q=80"),
