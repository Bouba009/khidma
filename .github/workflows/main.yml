              <string name="what_need">What do you need help with?</string>
              <string name="search_hint">Search a service, craft...</string>
              <string name="your_location">Your location</string>
              <string name="available_providers">Available Providers</string>
              <string name="btn_request">Request</string>
          </resources>
          EOF

          # نماذج البيانات (Models) مع صور وروابط حقيقية عالية الدقة
          cat << 'EOF' > app/src/main/java/com/khedmadz/app/data/model/Models.kt
          package com.khedmadz.app.data.model

          enum class UserRole { CLIENT, PRESTATAIRE }

          data class User(
              val uid: String = "",
              val fullName: String = "",
              val email: String = "",
