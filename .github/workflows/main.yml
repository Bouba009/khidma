          # 12. نظام التصميم والسمات (Theme)
          cat << 'EOF' > app/src/main/java/com/khedmadz/app/presentation/theme/Theme.kt
          package com.khedmadz.app.presentation.theme

          import androidx.compose.foundation.isSystemInDarkTheme
          import androidx.compose.material3.*
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.graphics.Color

          val PrimaryGreen = Color(0xFF0F9D58)
          val DarkGreen = Color(0xFF0B8043)
          val MintGreen = Color(0xFF26A69A)
          val AmberGold = Color(0xFFFFB300)

          val DarkBackground = Color(0xFF121212)
          val DarkSurface = Color(0xFF1E1E1E)
          val LightBackground = Color(0xFFF8F9FA)
          val LightSurface = Color(0xFFFFFFFF)

          private val DarkColorScheme = darkColorScheme(
              primary = PrimaryGreen,
              secondary = MintGreen,
              tertiary = AmberGold,
              background = DarkBackground,
              surface = DarkSurface,
              onPrimary = Color.White
          )

          private val LightColorScheme = lightColorScheme(
              primary = PrimaryGreen,
              secondary = MintGreen,
              tertiary = AmberGold,
              background = LightBackground,
              surface = LightSurface,
              onPrimary = Color.White
          )

          @Composable
          fun KhedmaDZTheme(
              darkTheme: Boolean = isSystemInDarkTheme(),
              content: @Composable () -> Unit
          ) {
              val colorScheme = if (darkTheme) DarkColorScheme else LightColorScheme
              MaterialTheme(
                  colorScheme = colorScheme,
                  content = content
              )
          }
          EOF

          # 13. نظام التنقل (Navigation Routes)
          cat << 'EOF' > app/src/main/java/com/khedmadz/app/presentation/navigation/Routes.kt
          package com.khedmadz.app.presentation.navigation

          sealed class Screen(val route: String) {
              object Splash : Screen("splash")
              object Login : Screen("login")
              object Register : Screen("register")
              object Home : Screen("home")
              object Providers : Screen("providers/{serviceId}") {
                  fun createRoute(serviceId: String) = "providers/$serviceId"
              }
              object Map : Screen("map")
              object RequestService : Screen("request_service/{providerName}/{serviceType}") {
                  fun createRoute(name: String, service: String) = "request_service/$name/$service"
              }
              object ProviderDashboard : Screen("provider_dashboard")
              object Chat : Screen("chat/{name}") {
                  fun createRoute(name: String) = "chat/$name"
              }
              object Profile : Screen("profile")
          }
          EOF

