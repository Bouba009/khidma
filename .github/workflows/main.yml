          # 12. ثيم الألوان الملكي الأزرق (Royal / Electric Blue FinTech Palette)
          cat << 'EOF' > app/src/main/java/com/khedmadz/app/presentation/theme/Theme.kt
          package com.khedmadz.app.presentation.theme

          import androidx.compose.material3.*
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.graphics.Color

          // الألوان الرئيسية المحددة في برومبت التصميم
          val PrimaryBlue      = Color(0xFF1677FF)
          val DeepBlue         = Color(0xFF0755C9)
          val DarkNavy         = Color(0xFF0B1F3A)
          val VeryLightBlue    = Color(0xFFEAF4FF)
          val AccentAmber      = Color(0xFFFFB020)
          val SoftAmber        = Color(0xFFFFF4DD)
          val SuccessGreen     = Color(0xFF16B364)
          val ErrorRed         = Color(0xFFEF4444)
          val BackgroundGray   = Color(0xFFF7F9FC)
          val TextDark         = Color(0xFF102033)
          val TextSecondary    = Color(0xFF667085)
          val BorderColor      = Color(0xFFEAECF0)

          private val RoyalColorScheme = lightColorScheme(
              primary = PrimaryBlue,
              onPrimary = Color.White,
              primaryContainer = VeryLightBlue,
              onPrimaryContainer = DeepBlue,
              secondary = AccentAmber,
              background = BackgroundGray,
              surface = Color.White,
              onSurface = TextDark
          )

          @Composable
          fun KhedmaDZTheme(content: @Composable () -> Unit) {
              MaterialTheme(
                  colorScheme = RoyalColorScheme,
                  content = content
              )
          }
          EOF

          # 13. المكونات المشتركة وأزرار Google و Facebook الأصلية
          cat << 'EOF' > app/src/main/java/com/khedmadz/app/presentation/components/Components.kt
          package com.khedmadz.app.presentation.components

          import androidx.compose.foundation.BorderStroke
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.*
          import androidx.compose.material.icons.rounded.Search
          import androidx.compose.material.icons.rounded.Tune
          import androidx.compose.material3.*
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Brush
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.layout.ContentScale
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import coil.compose.AsyncImage
          import com.khedmadz.app.data.model.ServiceCategory
          import com.khedmadz.app.data.model.User
          import com.khedmadz.app.presentation.theme.*

          // Hero Search Section بنمط التدرج الأزرق الملكي
          @Composable
          fun HeroSearchSection(onSearchClick: () -> Unit, onFilterClick: () -> Unit) {
              Box(
                  modifier = Modifier
                      .fillMaxWidth()
                      .clip(RoundedCornerShape(24.dp))
                      .background(Brush.linearGradient(listOf(DeepBlue, PrimaryBlue)))
                      .padding(20.dp)
              ) {
                  Column {
                      Text("De quoi avez-vous besoin ?", color = Color.White, fontSize = 20.sp, fontWeight = FontWeight.Bold)
                      Spacer(modifier = Modifier.height(4.dp))
                      Text("Trouvez un professionnel vérifié près de chez vous.", color = Color(0xFFEAF4FF), fontSize = 13.sp)
                      Spacer(modifier = Modifier.height(16.dp))

                      Surface(
                          modifier = Modifier
                              .fillMaxWidth()
                              .height(52.dp)
                              .clickable { onSearchClick() },
                          shape = RoundedCornerShape(16.dp),
                          color = Color.White,
                          shadowElevation = 6.dp
                      ) {
                          Row(
                              verticalAlignment = Alignment.CenterVertically,
                              modifier = Modifier.padding(horizontal = 14.dp)
                          ) {
                              Icon(Icons.Rounded.Search, contentDescription = null, tint = PrimaryBlue, modifier = Modifier.size(22.dp))
                              Spacer(modifier = Modifier.width(10.dp))
                              Text("Rechercher un service...", color = TextSecondary, fontSize = 13.sp, modifier = Modifier.weight(1f))
                              Box(
                                  modifier = Modifier
                                      .size(34.dp)
                                      .clip(CircleShape)
                                      .background(VeryLightBlue)
                                      .clickable { onFilterClick() },
                                  contentAlignment = Alignment.Center
                              ) {
                                  Icon(Icons.Rounded.Tune, contentDescription = null, tint = DeepBlue, modifier = Modifier.size(18.dp))
                              }
                          }
                      }
                  }
              }
          }

          // كبسولة اختيار الموقع
          @Composable
          fun LocationPillCard(locationText: String, onModifyClick: () -> Unit) {
              Surface(
                  modifier = Modifier
                      .fillMaxWidth()
                      .clip(RoundedCornerShape(16.dp))
                      .clickable { onModifyClick() },
                  color = Color.White,
                  border = BorderStroke(1.dp, BorderColor),
                  shadowElevation = 1.dp
              ) {
                  Row(
                      modifier = Modifier.padding(horizontal = 14.dp, vertical = 12.dp),
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      Box(
                          modifier = Modifier
                              .size(36.dp)
                              .clip(CircleShape)
                              .background(VeryLightBlue),
                          contentAlignment = Alignment.Center
                      ) {
                          Icon(Icons.Default.LocationOn, contentDescription = null, tint = PrimaryBlue, modifier = Modifier.size(20.dp))
                      }
                      Spacer(modifier = Modifier.width(10.dp))
                      Column(modifier = Modifier.weight(1f)) {
                          Text("Votre position", fontSize = 11.sp, color = TextSecondary)
                          Text(locationText, fontSize = 14.sp, fontWeight = FontWeight.SemiBold, color = TextDark)
                      }
                      Text("Modifier", color = PrimaryBlue, fontSize = 13.sp, fontWeight = FontWeight.Bold)
                  }
              }
          }

          // بطاقة الخدمة مع الصورة الحقيقية (2-Column Card)
          @Composable
          fun ServiceCatalogCard(service: ServiceCategory, onClick: () -> Unit) {
              Card(
                  shape = RoundedCornerShape(20.dp),
                  colors = CardDefaults.cardColors(containerColor = Color.White),
                  elevation = CardDefaults.cardElevation(defaultElevation = 2.dp),
                  border = BorderStroke(1.dp, BorderColor),
                  modifier = Modifier
                      .fillMaxWidth()
                      .height(165.dp)
                      .clickable { onClick() }
              ) {
                  Column(modifier = Modifier.fillMaxSize()) {
                      AsyncImage(
                          model = service.imageUrl,
                          contentDescription = service.nameFr,
                          contentScale = ContentScale.Crop,
                          modifier = Modifier
                              .fillMaxWidth()
                              .height(105.dp)
                              .clip(RoundedCornerShape(topStart = 20.dp, topEnd = 20.dp))
                      )
                      Column(modifier = Modifier.padding(10.dp)) {
