          package com.khedmadz.app

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.layout.*
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.navigation.compose.*
          import com.khedmadz.app.presentation.screens.*
          import com.khedmadz.app.presentation.theme.KhedmaDZTheme
          import com.khedmadz.app.presentation.theme.PrimaryBlue
          import com.khedmadz.app.presentation.theme.VeryLightBlue
          import kotlinx.coroutines.launch

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      KhedmaDZTheme {
                          KhedmaMasterApp()
                      }
                  }
              }
          }

          @Composable
          fun KhedmaMasterApp() {
              val rootNavController = rememberNavController()

              NavHost(navController = rootNavController, startDestination = "splash") {
                  composable("splash") { SplashScreen(rootNavController) }
                  composable("login") { LoginScreen(rootNavController) }
                  composable("main_flow") { MainClientContainer(rootNavController) }
                  composable("provider_dashboard") { ProviderDashboardScreen(rootNavController) }
                  composable("notifications") { NotificationsScreen(rootNavController) }
                  composable("filters") { FiltersScreen(rootNavController) }
                  composable("request_details") { RequestDetailsScreen(rootNavController) }
                  composable("providers_list/{serviceTitle}") { backStack ->
                      val title = backStack.arguments?.getString("serviceTitle") ?: "Infirmier"
                      ProvidersListScreen(rootNavController, title)
                  }
                  composable("provider_profile/{name}") { backStack ->
                      val name = backStack.arguments?.getString("name") ?: "Sami Belkacem"
                      ProviderProfileScreen(rootNavController, name)
                  }
                  composable("create_request/{name}/{service}") { backStack ->
                      val name = backStack.arguments?.getString("name") ?: "Sami Belkacem"
                      val service = backStack.arguments?.getString("service") ?: "Infirmier"
                      CreateRequestScreen(rootNavController, name, service)
                  }
                  composable("chat/{name}") { backStack ->
                      val name = backStack.arguments?.getString("name") ?: "Sami Belkacem"
                      ChatScreen(rootNavController, name)
                  }
              }
          }

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun MainClientContainer(rootNavController: androidx.navigation.NavController) {
              val drawerState = rememberDrawerState(initialValue = DrawerValue.Closed)
              val scope = rememberCoroutineScope()
              val bottomNavController = rememberNavController()
              var selectedBottomTab by remember { mutableStateOf(0) }
              var showLocationSheet by remember { mutableStateOf(false) }
              var selectedLocation by remember { mutableStateOf("Rouiba, Alger") }

              ModalNavigationDrawer(
                  drawerState = drawerState,
                  drawerContent = {
                      SideDrawerContent(rootNavController) {
                          scope.launch { drawerState.close() }
                      }
                  }
              ) {
                  Scaffold(
                      bottomBar = {
                          NavigationBar(containerColor = Color.White, tonalElevation = 6.dp) {
                              val items = listOf(
                                  "Accueil" to Icons.Default.Home,
                                  "Demandes" to Icons.Default.Assignment,
                                  "Carte" to Icons.Default.Map,
                                  "Messages" to Icons.Default.Chat,
                                  "Profil" to Icons.Default.Person
                              )
                              items.forEachIndexed { index, pair ->
                                  NavigationBarItem(
                                      selected = selectedBottomTab == index,
                                      onClick = {
                                          selectedBottomTab = index
                                          when (index) {
                                              0 -> bottomNavController.navigate("home") { popUpTo("home") { inclusive = true } }
                                              1 -> bottomNavController.navigate("requests")
                                              2 -> bottomNavController.navigate("map")
                                              3 -> rootNavController.navigate("chat/Sami Belkacem")
                                              4 -> bottomNavController.navigate("profile")
                                          }
                                      },
                                      icon = { Icon(pair.second, contentDescription = pair.first) },
                                      label = { Text(pair.first, fontSize = 11.sp, fontWeight = if (selectedBottomTab == index) FontWeight.Bold else FontWeight.Normal) },
                                      colors = NavigationBarItemDefaults.colors(selectedIconColor = PrimaryBlue, selectedTextColor = PrimaryBlue, indicatorColor = VeryLightBlue)
                                  )
                              }
                          }
                      }
                  ) { innerPadding ->
                      Box(modifier = Modifier.padding(innerPadding)) {
                          NavHost(navController = bottomNavController, startDestination = "home") {
                              composable("home") {
                                  HomeScreen(
                                      navController = rootNavController,
                                      onOpenLocationSheet = { showLocationSheet = true },
                                      onOpenDrawer = { scope.launch { drawerState.open() } },
                                      selectedLocation = selectedLocation
                                  )
                              }
                              composable("requests") { RequestsHistoryScreen(rootNavController) }
                              composable("map") { MapScreen(rootNavController) }
                              composable("profile") { ClientProfileScreen(rootNavController) }
                          }
                      }

                      if (showLocationSheet) {
                          LocationSelectorSheet(
                              onClose = { showLocationSheet = false },
                              onSelect = { loc ->
                                  selectedLocation = loc
                                  showLocationSheet = false
                              }
                          )
                      }
                  }
              }
          }
