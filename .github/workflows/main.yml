          import kotlinx.coroutines.delay

          // 1. Splash Screen
          @Composable
          fun SplashScreen(navController: NavController) {
              val scale = remember { Animatable(0.4f) }
              val alpha = remember { Animatable(0f) }

              LaunchedEffect(Unit) {
                  alpha.animateTo(1f, animationSpec = tween(700))
                  scale.animateTo(1f, animationSpec = spring(dampingRatio = Spring.DampingRatioMediumBouncy, stiffness = Spring.StiffnessLow))
                  delay(1600)
                  navController.navigate("login") { popUpTo("splash") { inclusive = true } }
              }

              Box(
                  modifier = Modifier
                      .fillMaxSize()
                      .background(Brush.verticalGradient(listOf(AlgerianGreenPrimary, AlgerianGreenDark))),
                  contentAlignment = Alignment.Center
              ) {
                  Column(horizontalAlignment = Alignment.CenterHorizontally, modifier = Modifier.scale(scale.value)) {
                      Box(
                          modifier = Modifier
                              .size(110.dp)
                              .clip(CircleShape)
                              .background(Color.White.copy(alpha = 0.18f)),
                          contentAlignment = Alignment.Center
                      ) {
                          Icon(Icons.Default.VolunteerActivism, contentDescription = "Logo", tint = Color.White, modifier = Modifier.size(68.dp))
                      }
                      Spacer(modifier = Modifier.height(20.dp))
                      Text("Khedma DZ", color = Color.White, fontSize = 34.sp, fontWeight = FontWeight.Black, letterSpacing = 1.sp)
                      Text("خدمة ديزاد • رعاية وخدمات منزلية متكاملة", color = Color.White.copy(alpha = 0.9f), fontSize = 14.sp)
                  }
              }
          }

          // 2. Modern Green Auth Screen with Google & Facebook Logos
          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun LoginScreen(navController: NavController) {
              var isRegisterMode by remember { mutableStateOf(false) }
              var email by remember { mutableStateOf("") }
              var password by remember { mutableStateOf("") }
