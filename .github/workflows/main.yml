                              Text("Emplacement sélectionné", fontSize = 11.sp, color = AlgerianGreenDark)
                              Text("$selectedWilaya - $selectedCommune", fontSize = 14.sp, fontWeight = FontWeight.Bold, color = AlgerianGreenDark)
                          }
                          Text("Changer ❯", fontSize = 12.sp, fontWeight = FontWeight.Bold, color = AlgerianGreenPrimary)
                      }
                  }

                  Spacer(modifier = Modifier.height(12.dp))

                  // Search Bar
                  OutlinedTextField(
                      value = searchQuery,
                      onValueChange = { searchQuery = it },
                      placeholder = { Text("Rechercher infirmier, plombier, nounou...") },
                      leadingIcon = { Icon(Icons.Default.Search, contentDescription = null, tint = AlgerianGreenPrimary) },
                      modifier = Modifier.fillMaxWidth(),
                      shape = RoundedCornerShape(16.dp),
                      colors = OutlinedTextFieldDefaults.colors(
                          unfocusedContainerColor = Color.White,
                          focusedContainerColor = Color.White,
                          unfocusedBorderColor = Color(0xFFE2E8F0)
                      )
                  )

                  Spacer(modifier = Modifier.height(12.dp))

                  // Category Filter Chips
                  val categories = listOf("Tous", "Santé", "Maison", "Dépannage", "Bâtiment")
                  LazyRow(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                      items(categories) { cat ->
                          FilterChip(
                              selected = selectedCategory == cat,
                              onClick = { selectedCategory = cat },
                              label = { Text(cat, fontSize = 12.sp) },
