                  ServiceItem("jardinier", "Jardinier", "بستاني", "Entretien de jardins et espaces verts"),
                  ServiceItem("plombier", "Plombier", "سباك", "Réparation sanitaires et fuites"),
                  ServiceItem("electricien", "Électricien", "كهربائي", "Pannes et installations électriques"),
                  ServiceItem("peintre", "Peintre", "دهان", "Peinture intérieure et extérieure"),
                  ServiceItem("reparateur", "Réparation", "مصلح أجهزة", "Électroménager et bricolage"),
                  ServiceItem("aide_domicile", "Aide à domicile", "مساعد منزلي", "Soutien aux personnes âgées")
              )

              fun getSampleProviders(): List<User> = listOf(
                  User("1", "Karim Benali", "karim@khedma.dz", "0550123456", "", UserRole.PRESTATAIRE.name, "Alger", "Bab Ezzouar", true, 36.7200, 3.1800, "Infirmier", 4.9, 28),
                  User("2", "Yasmine Saidi", "yasmine@khedma.dz", "0661987654", "", UserRole.PRESTATAIRE.name, "Alger", "Rouiba", true, 36.7350, 3.2850, "Infirmier", 4.8, 19),
                  User("3", "Mohamed Brahimi", "mohamed@khedma.dz", "0770554433", "", UserRole.PRESTATAIRE.name, "Alger", "Kouba", true, 36.7260, 3.0850, "Plombier", 4.7, 34)
