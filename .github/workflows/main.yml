                  Spacer(modifier = Modifier.height(10.dp))

                  // Grid of Services with Real High-Quality Photos
                  val filteredServices = AppRepository.servicesList.filter {
                      (selectedCategory == "Tous" || it.category == selectedCategory) &&
                      (it.nameFr.contains(searchQuery, ignoreCase = true) || it.nameAr.contains(searchQuery))
                  }

                  LazyVerticalGrid(
                      columns = GridCells.Fixed(2),
                      horizontalArrangement = Arrangement.spacedBy(12.dp),
                      verticalArrangement = Arrangement.spacedBy(12.dp),
                      modifier = Modifier.fillMaxSize()
