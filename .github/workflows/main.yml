              // بيانات الحرفيين المعتمدين المطابقين للتصميم
              val sampleProviders = listOf(
                  User("1", "Sami Belkacem", "sami@khedma.dz", "0550123456", "https://images.unsplash.com/photo-1622253692010-333f2da6031d?w=400", UserRole.PRESTATAIRE.name, "Alger", "Rouiba", true, 36.7350, 3.2850, "Infirmier", 4.8, 124, 5, "1500 DA / h"),
