name: Build Khedma DZ Android App

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Generate & Build Khedma DZ Royal Edition
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Scaffold Project & Generate Source Code
        run: |
          set -e

          # 1. إنشاء هيكل المجلدات
          mkdir -p gradle/wrapper
          mkdir -p app/src/main/java/com/khedmadz/app/data/model
          mkdir -p app/src/main/java/com/khedmadz/app/data/repository
          mkdir -p app/src/main/java/com/khedmadz/app/presentation/theme
          mkdir -p app/src/main/java/com/khedmadz/app/presentation/components
          mkdir -p app/src/main/java/com/khedmadz/app/presentation/screens
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/values-ar
          mkdir -p app/src/main/res/values-en

          # 2. ملف local.properties
          echo "sdk.dir=$ANDROID_HOME" > local.properties

          # 3. ملف gradle.properties
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          EOF

          # 4. ملف settings.gradle.kts
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "KhedmaDZ"
          include(":app")
          EOF

          # 5. ملف build.gradle.kts (الجذر)
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.4.1" apply false
              id("org.jetbrains.kotlin.android") version "1.9.23" apply false
              id("com.google.gms.google-services") version "4.4.1" apply false
          }
          EOF

          # 6. ملف app/build.gradle.kts
          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("com.google.gms.google-services")
          }

          android {
              namespace = "com.khedmadz.app"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.khedmadz.app"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 3
                  versionName = "2.0.0"

                  testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
                  vectorDrawables {
                      useSupportLibrary = true
                  }

                  val mapsKey = project.findProperty("MAPS_API_KEY") as? String ?: "AIzaSyDummyMapsKeyForBuild"
                  manifestPlaceholders["MAPS_API_KEY"] = mapsKey
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      proguardFiles(
                          getDefaultProguardFile("proguard-android-optimize.txt"),
                          "proguard-rules.pro"
                      )
                      signingConfig = signingConfigs.getByName("debug")
                  }
                  debug {
                      isDebuggable = true
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              buildFeatures {
                  compose = true
              }

              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.11"
              }

              packaging {
                  resources {
                      excludes += "/META-INF/{AL2.0,LGPL2.1}"
                  }
              }

              lint {
                  abortOnError = false
                  checkReleaseBuilds = false
              }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.02.00")
              implementation(composeBom)
              androidTestImplementation(composeBom)

              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.7.0")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0")
              implementation("androidx.activity:activity-compose:1.8.2")

              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.navigation:navigation-compose:2.7.7")

              // Firebase
              val firebaseBom = platform("com.google.firebase:firebase-bom:32.8.0")
              implementation(firebaseBom)
              implementation("com.google.firebase:firebase-analytics")
              implementation("com.google.firebase:firebase-auth")
              implementation("com.google.firebase:firebase-firestore")
              implementation("com.google.firebase:firebase-storage")
              implementation("com.google.firebase:firebase-messaging")

              // Maps & Location
              implementation("com.google.android.gms:play-services-location:21.2.0")
              implementation("com.google.android.gms:play-services-maps:18.2.0")
              implementation("com.google.maps.android:maps-compose:4.3.3")

              // Image Loading (Coil)
              implementation("io.coil-kt:coil-compose:2.6.0")

              // Coroutines
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.0")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.8.0")
          }
          EOF

          # 7. ملف google-services.json متوافق مع الحزمتين (com.khedmadz.app و com.khedmadz.app.debug)
          cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "khedmadz-app",
              "storage_bucket": "khedmadz-app.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:abcdef1234567890",
                  "android_client_info": {
                    "package_name": "com.khedmadz.app"
                  }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "AIzaSyFakeKeyPlaceholderForBuildOnly12345" }],
                "services": {}
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:abcdef1234567891",
                  "android_client_info": {
                    "package_name": "com.khedmadz.app.debug"
                  }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "AIzaSyFakeKeyPlaceholderForBuildOnly12345" }],
                "services": {}
              }
            ],
            "configuration_version": "1"
          }
          EOF

          touch app/proguard-rules.pro

          # 8. ملف AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:name=".KhedmaApp"
                  android:allowBackup="true"
                  android:icon="@android:drawable/ic_dialog_info"
                  android:label="@string/app_name"
                  android:roundIcon="@android:drawable/ic_dialog_info"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">

                  <meta-data
                      android:name="com.google.android.geo.API_KEY"
                      android:value="${MAPS_API_KEY}" />

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>

          </manifest>
          EOF

          # 9. ملفات اللغات والترجمة (Strings)
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Khedma DZ</string>
              <string name="tagline">Vos services à domicile en toute confiance</string>
              <string name="login_title">Khedma DZ</string>
              <string name="login_subtitle">Connectez-vous pour accéder à tous les services</string>
              <string name="what_need">De quoi avez-vous besoin ?</string>
              <string name="hero_subtitle">Trouvez un professionnel qualifié près de chez vous</string>
              <string name="search_hint">Rechercher un service, un artisan...</string>
              <string name="your_position">Votre position</string>
              <string name="services_title">Nos services</string>
              <string name="see_all">Voir tout</string>
              <string name="providers_title">Prestataires disponibles</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values-ar/strings.xml
          <resources>
              <string name="app_name">خدمة ديزاد</string>
              <string name="tagline">خدماتكم المنزلية بكل ثقة وأمان</string>
              <string name="login_title">خدمة DZ</string>
              <string name="login_subtitle">سجل الدخول للوصول إلى كافة الخدمات</string>
              <string name="what_need">ما هي الخدمة التي تبحث عنها ؟</string>
              <string name="hero_subtitle">اعثر على أفضل الحرفيين والمهنيين بقربك</string>
              <string name="search_hint">ابحث عن خدمة، ممرض، سباك...</string>
              <string name="your_position">موقعك الحالي</string>
              <string name="services_title">خدماتنا المميزة</string>
              <string name="see_all">عرض الكل</string>
              <string name="providers_title">مقدمو الخدمات المتاحون</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values-en/strings.xml
          <resources>
              <string name="app_name">Khedma DZ</string>
              <string name="tagline">Your trusted home services marketplace</string>
              <string name="login_title">Khedma DZ</string>
              <string name="login_subtitle">Sign in to access verified professionals</string>
              <string name="what_need">What do you need help with?</string>
              <string name="hero_subtitle">Find certified professionals near you</string>
              <string name="search_hint">Search a service, craft...</string>
              <string name="your_position">Your location</string>
              <string name="services_title">Our Services</string>
              <string name="see_all">See all</string>
              <string name="providers_title">Available Providers</string>
          </resources>
          EOF

          # 10. نماذج البيانات (Models)
          cat << 'EOF' > app/src/main/java/com/khedmadz/app/data/model/Models.kt
          package com.khedmadz.app.data.model

          enum class UserRole { CLIENT, PRESTATAIRE }

          data class User(
              val uid: String = "",
              val fullName: String = "",
              val email: String = "",
              val phoneNumber: String = "",
              val photoUrl: String = "",
              val role: String = UserRole.CLIENT.name,
              val wilaya: String = "Alger",
              val commune: String = "Rouiba",
              val isOnline: Boolean = true,
              val latitude: Double? = 36.7538,
              val longitude: Double? = 3.0588,
              val serviceCategory: String = "Infirmier",
              val ratingAverage: Double = 4.8,
              val ratingCount: Int = 124,
              val experienceYears: Int = 5,
              val priceStartingFrom: String = "1500 DA / h"
          )

          data class ServiceCategory(
              val id: String = "",
              val nameFr: String = "",
              val nameAr: String = "",
              val imageUrl: String = ""
          )

          data class AppNotification(
              val id: String = "",
              val title: String = "",
              val description: String = "",
              val time: String = "Il y a 5 min",
              val isRead: Boolean = false,
              val type: String = "NEW_REQUEST"
          )

          data class ServiceRequest(
              val id: String = "",
              val serviceTitle: String = "Infirmier / Infirmière",
              val providerName: String = "Sami Belkacem",
              val date: String = "19 sept. 2026",
              val time: String = "10:00 - 12:00",
              val location: String = "Rouiba, Alger",
              val status: String = "PENDING"
          )

          data class ChatMessage(
              val id: String = "",
              val sender: String = "",
              val message: String = "",
              val time: String = "09:47"
          )
          EOF

          # 11. المستودع والبيانات الحقيقية (Mock Data & Unsplash Photos)
          cat << 'EOF' > app/src/main/java/com/khedmadz/app/data/repository/AppRepository.kt
          package com.khedmadz.app.data.repository

          import com.khedmadz.app.data.model.*

          object AppRepository {

              val algerianWilayas = listOf(
                  "16 - Alger",
