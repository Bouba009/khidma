              // صور الخدمات الحقيقية المطابقة لصور العرض
              val servicesCatalog = listOf(
                  ServiceCategory("1", "Infirmier / Infirmière", "ممرض / ممرضة", "https://images.unsplash.com/photo-1576091160399-112ba8d25d1d?w=600&auto=format&fit=crop&q=80"),
                  ServiceCategory("2", "Garde malade", "مرافق مريض", "https://images.unsplash.com/photo-1584515979956-d9f6e5d09982?w=600&auto=format&fit=crop&q=80"),
