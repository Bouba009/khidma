          package com.khedmadz.app.presentation.theme

          import androidx.compose.material3.*
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.graphics.Color

          val AlgerianGreenPrimary = Color(0xFF0A8F4E)
          val AlgerianGreenDark = Color(0xFF005A2B)
          val AlgerianMint = Color(0xFFE8F5E9)
          val AccentGold = Color(0xFFFFB300)
          val DarkCardBg = Color(0xFF1E293B)
          val SoftGrayBg = Color(0xFFF8FAFC)

          private val ColorScheme = lightColorScheme(
              primary = AlgerianGreenPrimary,
              onPrimary = Color.White,
              primaryContainer = AlgerianMint,
              onPrimaryContainer = AlgerianGreenDark,
              secondary = AccentGold,
              background = SoftGrayBg,
              surface = Color.White,
              onSurface = Color(0xFF0F172A)
          )

          @Composable
          fun KhedmaDZTheme(content: @Composable () -> Unit) {
              MaterialTheme(
                  colorScheme = ColorScheme,
                  content = content
              )
          }
          EOF

