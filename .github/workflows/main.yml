          import com.khedmadz.app.data.model.UserRole
          import com.khedmadz.app.data.repository.AppRepository
          import com.khedmadz.app.presentation.navigation.Screen
          import com.khedmadz.app.presentation.theme.DarkGreen
          import com.khedmadz.app.presentation.theme.PrimaryGreen
          import kotlinx.coroutines.delay

          @Composable
          fun SplashScreen(navController: NavController) {
              val scale = remember { Animatable(0.5f) }

              LaunchedEffect(Unit) {
                  scale.animateTo(
                      targetValue = 1f,
                      animationSpec = spring(dampingRatio = Spring.DampingRatioMediumBouncy, stiffness = Spring.StiffnessLow)
                  )
                  delay(1500)
                  navController.navigate(Screen.Login.route) {
                      popUpTo(Screen.Splash.route) { inclusive = true }
                  }
              }

              Box(
                  modifier = Modifier
                      .fillMaxSize()
                      .background(Brush.verticalGradient(listOf(PrimaryGreen, DarkGreen))),
                  contentAlignment = Alignment.Center
              ) {
                  Column(horizontalAlignment = Alignment.CenterHorizontally, modifier = Modifier.scale(scale.value)) {
                      Icon(
                          imageVector = Icons.Default.VolunteerActivism,
                          contentDescription = "Logo",
                          tint = Color.White,
                          modifier = Modifier.size(100.dp)
                      )
                      Spacer(modifier = Modifier.height(16.dp))
                      Text("Khedma DZ", color = Color.White, fontSize = 32.sp, fontWeight = FontWeight.Bold)
                      Text("Services à domicile en Algérie", color = Color.White.copy(alpha = 0.85f), fontSize = 14.sp)
                  }
              }
          }

          @Composable
          fun LoginScreen(navController: NavController) {
              var email by remember { mutableStateOf("") }
              var password by remember { mutableStateOf("") }
              var selectedRole by remember { mutableStateOf(UserRole.CLIENT) }

              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .verticalScroll(rememberScrollState())
                      .padding(24.dp),
                  horizontalAlignment = Alignment.CenterHorizontally
              ) {
                  Spacer(modifier = Modifier.height(40.dp))
                  Icon(Icons.Default.VolunteerActivism, contentDescription = null, tint = PrimaryGreen, modifier = Modifier.size(64.dp))
                  Spacer(modifier = Modifier.height(16.dp))
                  Text(stringResource(R.string.login_title), fontSize = 24.sp, fontWeight = FontWeight.Bold)
                  Text(stringResource(R.string.login_subtitle), color = Color.Gray, fontSize = 14.sp)
                  Spacer(modifier = Modifier.height(32.dp))

                  Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.Center) {
                      FilterChip(
                          selected = selectedRole == UserRole.CLIENT,
                          onClick = { selectedRole = UserRole.CLIENT },
                          label = { Text(stringResource(R.string.role_client)) }
                      )
                      Spacer(modifier = Modifier.width(12.dp))
                      FilterChip(
