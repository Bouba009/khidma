          # 15. كلاس التطبيق الرئيسي والـ MainActivity
          cat << 'EOF' > app/src/main/java/com/khedmadz/app/KhedmaApp.kt
          package com.khedmadz.app

          import android.app.Application

          class KhedmaApp : Application() {
              override fun onCreate() {
                  super.onCreate()
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/khedmadz/app/MainActivity.kt
          package com.khedmadz.app

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.runtime.Composable
          import androidx.navigation.compose.NavHost
          import androidx.navigation.compose.composable
          import androidx.navigation.compose.rememberNavController
          import com.khedmadz.app.presentation.navigation.Screen
          import com.khedmadz.app.presentation.screens.*
          import com.khedmadz.app.presentation.theme.KhedmaDZTheme

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      KhedmaDZTheme {
                          KhedmaNavHost()
                      }
                  }
              }
          }

          @Composable
          fun KhedmaNavHost() {
              val navController = rememberNavController()
              NavHost(navController = navController, startDestination = Screen.Splash.route) {
                  composable(Screen.Splash.route) { SplashScreen(navController) }
                  composable(Screen.Login.route) { LoginScreen(navController) }
                  composable(Screen.Home.route) { HomeScreen(navController) }
                  composable(Screen.Map.route) { MapScreen(navController) }
                  composable(Screen.Profile.route) { ProfileScreen(navController) }
                  composable(Screen.ProviderDashboard.route) { ProviderDashboardScreen(navController) }
                  composable(Screen.Providers.route) { backStackEntry ->
                      val serviceId = backStackEntry.arguments?.getString("serviceId") ?: ""
                      ProvidersScreen(navController, serviceId)
                  }
                  composable(Screen.RequestService.route) { backStackEntry ->
                      val providerName = backStackEntry.arguments?.getString("providerName") ?: ""
                      val serviceType = backStackEntry.arguments?.getString("serviceType") ?: ""
                      CreateRequestScreen(navController, providerName, serviceType)
                  }
                  composable(Screen.Chat.route) { backStackEntry ->
                      val name = backStackEntry.arguments?.getString("name") ?: "Contact"
                      ChatScreen(navController, name)
                  }
              }
          }
          EOF

      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Build Release AAB (Android App Bundle)
        run: |
          ./gradlew bundleRelease --stacktrace --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KhedmaDZ-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KhedmaDZ-Release-AAB
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 14
