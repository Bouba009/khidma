          # الحاوية الرئيسية (MainActivity) مع شريط التنقل السفلي ونافذة الـ GPS والولايات
          cat << 'EOF' > app/src/main/java/com/khedmadz/app/MainActivity.kt
          package com.khedmadz.app

          import android.os.Bundle
          import android.widget.Toast
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.navigation.compose.*
          import com.khedmadz.app.data.repository.AppRepository
          import com.khedmadz.app.presentation.screens.*
          import com.khedmadz.app.presentation.theme.AlgerianGreenDark
          import com.khedmadz.app.presentation.theme.AlgerianGreenPrimary
          import com.khedmadz.app.presentation.theme.AlgerianMint
          import com.khedmadz.app.presentation.theme.KhedmaDZTheme

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      KhedmaDZTheme {
                          KhedmaAppNavigation()
                      }
                  }
              }
          }

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun KhedmaAppNavigation() {
              val rootNavController = rememberNavController()

              NavHost(navController = rootNavController, startDestination = "splash") {
                  composable("splash") { SplashScreen(rootNavController) }
                  composable("login") { LoginScreen(rootNavController) }
                  composable("main_flow") { MainBottomNavContainer(rootNavController) }
                  composable("notifications") { NotificationsScreen(rootNavController) }
                  composable("provider_dashboard") { ProviderDashboardScreen(rootNavController) }
                  composable("providers/{serviceName}") { backStack ->
                      val serviceName = backStack.arguments?.getString("serviceName") ?: "Service"
                      ProvidersScreen(rootNavController, serviceName)
                  }
                  composable("request/{providerName}/{serviceType}") { backStack ->
                      val providerName = backStack.arguments?.getString("providerName") ?: "Prestataire"
                      val serviceType = backStack.arguments?.getString("serviceType") ?: "Service"
                      CreateRequestScreen(rootNavController, providerName, serviceType)
                  }
                  composable("chat/{name}") { backStack ->
                      val name = backStack.arguments?.getString("name") ?: "Discussion"
                      ChatScreen(rootNavController, name)
                  }
              }
          }

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun MainBottomNavContainer(rootNavController: androidx.navigation.NavController) {
              val context = LocalContext.current
              val bottomNavController = rememberNavController()
              var selectedTab by remember { mutableStateOf(0) }
              var showLocationSheet by remember { mutableStateOf(false) }

              var selectedWilaya by remember { mutableStateOf("16 - Alger") }
              var selectedCommune by remember { mutableStateOf("Bab Ezzouar") }

              Scaffold(
                  bottomBar = {
                      NavigationBar(
                          containerColor = Color.White,
                          tonalElevation = 8.dp
                      ) {
                          val items = listOf("Accueil" to Icons.Default.Home, "Carte" to Icons.Default.Map, "Demandes" to Icons.Default.Assignment, "Profil" to Icons.Default.Person)
                          items.forEachIndexed { index, item ->
                              NavigationBarItem(
                                  selected = selectedTab == index,
                                  onClick = {
                                      selectedTab = index
                                      when (index) {
                                          0 -> bottomNavController.navigate("home") { popUpTo("home") { inclusive = true } }
                                          1 -> bottomNavController.navigate("map")
                                          2 -> bottomNavController.navigate("requests")
                                          3 -> bottomNavController.navigate("profile")
                                      }
                                  },
                                  icon = { Icon(item.second, contentDescription = item.first) },
                                  label = { Text(item.first, fontSize = 11.sp, fontWeight = if (selectedTab == index) FontWeight.Bold else FontWeight.Normal) },
                                  colors = NavigationBarItemDefaults.colors(
                                      selectedIconColor = AlgerianGreenPrimary,
                                      selectedTextColor = AlgerianGreenPrimary,
                                      indicatorColor = AlgerianMint
                                  )
                              )
                          }
                      }
                  }
              ) { padding ->
                  Box(modifier = Modifier.padding(padding)) {
                      NavHost(navController = bottomNavController, startDestination = "home") {
                          composable("home") {
                              HomeScreen(
                                  navController = rootNavController,
                                  onOpenLocationSheet = { showLocationSheet = true },
                                  selectedWilaya = selectedWilaya,
                                  selectedCommune = selectedCommune,
                                  unreadCount = 2
                              )
                          }
                          composable("map") { MapScreen(rootNavController) }
                          composable("requests") { RequestsScreen(rootNavController) }
                          composable("profile") { ProfileScreen(rootNavController) }
                      }
                  }

                  // Algerian Location Selector Bottom Sheet (GPS or Wilaya / Commune)
                  if (showLocationSheet) {
                      ModalBottomSheet(
                          onDismissRequest = { showLocationSheet = false },
                          containerColor = Color.White
                      ) {
                          Column(modifier = Modifier.padding(20.dp)) {
                              Text("📍 Choisir votre localisation", fontSize = 18.sp, fontWeight = FontWeight.Bold)
                              Spacer(modifier = Modifier.height(14.dp))

                              // Button 1: GPS Auto-Detect
                              Button(
                                  onClick = {
                                      selectedWilaya = "16 - Alger (GPS)"
                                      selectedCommune = "Alger Centre"
                                      Toast.makeText(context, "Position GPS activée avec succès !", Toast.LENGTH_SHORT).show()
                                      showLocationSheet = false
                                  },
                                  modifier = Modifier.fillMaxWidth().height(48.dp),
                                  shape = RoundedCornerShape(12.dp),
                                  colors = ButtonDefaults.buttonColors(containerColor = AlgerianGreenPrimary)
                              ) {
                                  Icon(Icons.Default.MyLocation, contentDescription = null)
                                  Spacer(modifier = Modifier.width(8.dp))
                                  Text("Activer / Utiliser ma position GPS", fontWeight = FontWeight.Bold)
                              }

                              Spacer(modifier = Modifier.height(14.dp))
                              Text("Ou sélectionner la Wilaya manuellement :", fontSize = 13.sp, color = Color.Gray)
                              Spacer(modifier = Modifier.height(8.dp))

                              // List of Algerian Wilayas
                              LazyColumn(modifier = Modifier.height(200.dp)) {
                                  items(AppRepository.algerianWilayas) { wilaya ->
                                      Row(
                                          modifier = Modifier
                                              .fillMaxWidth()
                                              .clickable {
                                                  selectedWilaya = wilaya
                                                  showLocationSheet = false
                                              }
                                              .padding(vertical = 10.dp),
                                          verticalAlignment = Alignment.CenterVertically
                                      ) {
                                          Icon(Icons.Default.Place, contentDescription = null, tint = AlgerianGreenPrimary, modifier = Modifier.size(18.dp))
                                          Spacer(modifier = Modifier.width(8.dp))
                                          Text(wilaya, fontWeight = if (selectedWilaya == wilaya) FontWeight.Bold else FontWeight.Normal)
                                      }
                                  }
                              }
                          }
                      }
                  }
              }
          }
